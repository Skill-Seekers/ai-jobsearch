name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (standard library only)
        run: |
          cd tests
          python -m unittest discover -s . -t . -v
      - name: Demo runs end to end
        run: python examples/run_demo.py "$RUNNER_TEMP/demo"
      - name: Privacy scanner self-test
        run: python tools/privacy_scan.py selftest
      - name: Plugin package builds
        run: python tools/build_plugin.py --out "$RUNNER_TEMP/dist"
